# Publishes a release whenever something is merged into main (main only accepts pull requests).
#
# 1. Runs the tests.
# 2. Reads "## Version:" from DuelLadder.toc. If tag v<version> already exists, nothing is
#    published (merges that don't bump the version, e.g. docs or test changes, are skipped).
# 3. Otherwise creates the tag v<version> on the merged commit, and the BigWigs packager builds
#    DuelLadder-<tag>.zip (without tests/, see .pkgmeta) and creates the GitHub Release. If the
#    CF_API_TOKEN secret is set and DuelLadder.toc has "## X-Curse-Project-ID:", it uploads to
#    CurseForge too; otherwise that step is skipped.
#
# To ship a change: bump "## Version:" in DuelLadder.toc in the pull request.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub Release
    env:
      # packager@v2 reads GITHUB_OAUTH (newer packager versions also accept GH_API_TOKEN)
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the packager builds the changelog from the commit history

      - name: Tag the version in the .toc (skip if already released)
        id: version
        run: |
          version=$(sed -n 's/^## Version: *//p' DuelLadder.toc | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::No '## Version:' line found in DuelLadder.toc"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists, so there's nothing new to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "v$version"
          git push origin "v$version"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Package and publish
        if: steps.version.outputs.publish == 'true'
        uses: BigWigsMods/packager@v2
