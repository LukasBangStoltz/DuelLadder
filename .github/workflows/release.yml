# Publishes a release when a version tag is pushed, e.g.:
#   git tag v0.4.1
#   git push origin v0.4.1
#
# 1. Runs the tests.
# 2. Checks the tag matches "## Version:" in DuelLadder.toc (tag v0.4.1 <-> Version 0.4.1).
# 3. The BigWigs packager builds DuelLadder-<tag>.zip (without tests/, see .pkgmeta) and
#    creates the GitHub Release. If the CF_API_TOKEN secret is set and DuelLadder.toc has
#    "## X-Curse-Project-ID:", it uploads to CurseForge too; otherwise that step is skipped.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the packager builds the changelog from the commit history

      - name: Check the tag matches the .toc version
        run: |
          toc_version=$(sed -n 's/^## Version: *//p' DuelLadder.toc | tr -d '\r')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$toc_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match '## Version: $toc_version' in DuelLadder.toc"
            exit 1
          fi

      - name: Package and publish
        uses: BigWigsMods/packager@v2
